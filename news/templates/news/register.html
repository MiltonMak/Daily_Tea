{% extends "news/base.html" %}

{% block title %}
    Register | Daily Tea
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="h3 fw-bold mb-2">
                            Join Daily Tea
                        </h1>

                        <p class="text-muted mb-4">
                            Create an account and start
                            exploring Daily Tea.
                        </p>


                        <form method="post">

                            {% csrf_token %}

                            {{ form.as_p }}


                            <button
                                type="submit"
                                class="btn btn-daily w-100"
                            >
                                Create Account
                            </button>

                        </form>


                        <p class="text-center mt-4 mb-0">

                            Already have an account?

                            <a href="{% url 'login' %}">
                                Login
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
