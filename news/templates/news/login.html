{% extends "news/base.html" %}

{% block title %}
    Login | Daily Tea
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="h3 fw-bold mb-2">
                            Welcome back
                        </h1>

                        <p class="text-muted mb-4">
                            Login to your Daily Tea account.
                        </p>


                        <form method="post">

                            {% csrf_token %}

                            {{ form.as_p }}

                            <button
                                type="submit"
                                class="btn btn-daily w-100"
                            >
                                Login
                            </button>

                        </form>


                        <p class="text-center mt-4 mb-0">

                            Don't have an account?

                            <a href="{% url 'register' %}">
                                Create one
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
